  summary: "Serving the Catholic community in Apache and the surrounding area."
  image: "/images/parishes/official/mother-of-sorrows-exterior.jpg"
  image_alt: "Mother of Sorrows Catholic Church in Apache, Oklahoma"
  image_credit: "Parish-owned photograph"
  gallery:
    exterior:
      src: "/images/parishes/official/mother-of-sorrows-exterior.jpg"
      alt: "Mother of Sorrows Catholic Church in Apache, Oklahoma"
    interior:
      src: "/images/parishes/official/mother-of-sorrows-interior.jpg"
      alt: "The nave and sanctuary inside Mother of Sorrows Catholic Church"
      caption: "The historic nave of Mother of Sorrows, looking toward the altar and Crucifix."
    detail:
      src: "/images/parishes/official/mother-of-sorrows-window.jpg"
      alt: "Red and white church window between Stations of the Cross at Mother of Sorrows"
      caption: "A window framed by Stations of the Cross inside Mother of Sorrows."
  patron_prayer:
    title: "Prayer to Our Lady of Sorrows"
    paragraphs:
      - "Our Mother of Sorrows, with strength from above you stood by the Cross, sharing in the sufferings of Jesus, and with tender care you bore Him in your arms, mourning and weeping."
      - "We praise you for your faith, which accepted the life God planned for you. We praise you for your hope, which trusted that God would do great things in you. We praise you for your love in bearing with Jesus the sorrows of His Passion."
      - "Holy Mary, may we follow your example and stand by all your children who need comfort and love."
      - "Mother of God, stand by us in our trials and care for us in our many needs. Pray for us now and at the hour of our death."
  visitor_access:
    parking_entrance: "Parking is available near the church. The main entrance has a ramp with railings, and there are no steps that prevent access to worship."
    family_seating: "Families are welcome to sit together throughout Mass. Mother of Sorrows does not have a separate cry room."
    restrooms: "Accessible restrooms are available in the parish hall. A changing table is not currently available."
  history:
    - "The Catholic history of Mother of Sorrows begins with Rev. Urban de Hasque, a young Belgian priest who first visited Apache on October 9, 1901. The first Catholic service in Apache was held on November 27, 1901, in George Rose’s building."
    - "The congregation organized quickly, and a committee secured land for a church. During the next few years, the community built the church, working through financial challenges and questions about the best location."
    - "After Christmas 1905, the church was moved to the location where it stands today. A rectory was built east of the church by Rev. Frederick Van der Aa, the first resident priest, who served there from 1907 to 1925."
  history_source_note: "History adapted from the former Tri-Parish About page."
