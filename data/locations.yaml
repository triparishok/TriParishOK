  apple_map_url: "https://maps.apple.com/?daddr=8492+State+HWY+17+Elgin+OK+73538&dirflg=d"
  parish_class: "parish-st-ann"
  summary: "Serving the Catholic community in Elgin and the surrounding area."
  image: "/images/parishes/official/st-ann-exterior.jpg"
  image_alt: "St. Ann Catholic Church in Elgin, Oklahoma"
  image_credit: "Parish-owned photograph"
  gallery:
    exterior:
      src: "/images/parishes/official/st-ann-exterior.jpg"
      alt: "St. Ann Catholic Church and its outdoor shrine in Elgin, Oklahoma"
    interior:
      src: "/images/parishes/official/st-ann-interior.jpg"
      alt: "The nave, baptismal font, and sanctuary inside St. Ann Catholic Church"
      caption: "Inside St. Ann, the baptismal font stands at the entrance to the nave and the altar draws the eye toward the Crucifix."
    detail:
      src: "/images/parishes/official/st-ann-stained-glass.jpg"
      alt: "Colorful stained-glass window inside St. Ann Catholic Church"
      caption: "One of St. Ann’s colorful stained-glass windows."
  patron_prayer:
    title: "Prayer to St. Anne"
    paragraphs:
      - "O glorious St. Anne, you are filled with compassion for those who invoke you and with love for those who suffer. Heavily burdened with the weight of my troubles, I cast myself at your feet and humbly beg of you to take the present intention which I recommend to you in your special care. Please recommend it to your daughter, the Blessed Virgin Mary, and place it before the throne of Jesus, so that He may bring it to a happy issue. Continue to intercede for me until my request is granted."
      - "But, above all, obtain for me the grace one day to see my God face to face, and with you and Mary and all the saints to praise and bless Him for all eternity."
  visitor_access:
    parking_entrance: "Parking is available near the church. The main entrance has a ramp with railings, and there are no steps that prevent access to worship."
    family_seating: "Families are welcome to sit together anywhere in the church. A cry room is available for families who need it."
    restrooms: "Restrooms are available in the parish hall and inside the cry room. The cry-room restroom does not have a changing table."
  recurring_events:
    - title: "Sunday Coffee and Donuts"
      when: "First Sunday after the 8:30 AM Mass"
      location: "St. Ann Parish Hall"
      description: "Join parishioners for coffee and donuts in the parish hall after the 8:30 AM First Sunday Mass."

  history:
    - "St. Ann traces its roots to a Catholic community in Elgin that first worshiped in a former schoolhouse known as St. Anthony’s. Before a regular Mass schedule was established, priests came from Lawton and the church served as a chapel of convenience for local Catholic families."
    - "In 1941, the community began planning for a new church. Parish families contributed money and livestock, and Catholic Extension Society support helped make the new church possible. The church was named St. Ann’s in memory of Anna A. Beckert."
    - "Construction began in November 1946, with much of the work done by parish members. The new church was dedicated on May 11, 1948. A parish hall was built in 1967, a rectory was added in 1997, and new religious education classrooms were built in 2004."
  history_source_note: "History adapted from the former Tri-Parish About page."

- name: "Our Lady of Perpetual Help"
  slug: "olph"
  short_name: "OLPH"
  city: "Sterling"
  established: "1904"
  address: "122 N A Ave"
  address_line_2: "Sterling, OK 73567"
  map_url: "https://www.google.com/maps/search/?api=1&query=122+N+A+Ave+Sterling+OK+73567"
  apple_map_url: "https://maps.apple.com/?daddr=122+N+A+Ave+Sterling+OK+73567&dirflg=d"
  parish_class: "parish-olph"
  summary: "Serving the Catholic community in Sterling and the surrounding area."
  image: "/images/parishes/official/olph-exterior.jpg"
  image_alt: "Our Lady of Perpetual Help Catholic Church in Sterling, Oklahoma"
  image_credit: "Parish-owned photograph"
  gallery:
    exterior:
      src: "/images/parishes/official/olph-exterior.jpg"
      alt: "Our Lady of Perpetual Help Catholic Church in Sterling, Oklahoma"
    interior:
      src: "/images/parishes/official/olph-interior.jpg"
      alt: "The nave and sanctuary inside Our Lady of Perpetual Help Catholic Church"
      caption: "The nave of Our Lady of Perpetual Help leads toward the altar, tabernacle, and Crucifix."
    detail:
      src: "/images/parishes/official/olph-crucifixion-window.jpg"
      alt: "Stained-glass window depicting the Crucifixion of Jesus at Our Lady of Perpetual Help"
      caption: "The Crucifixion depicted in stained glass inside Our Lady of Perpetual Help."
  patron_prayer:
    title: "Prayer to Our Lady of Perpetual Help"
    paragraphs:
      - "Our Lady of Perpetual Help, you have been blessed and favored by God. You became not only the Mother of the Redeemer but the Mother of the redeemed as well. We come to you today as your loving children. Watch over us and take care of us. As you held the Child Jesus in your loving arms, so take us in your arms. Be a mother ready at every moment to help us."
      - "For God who is mighty has done great things for you, and His mercy is from age to age on those who love Him. Our greatest fear is that, in time of temptation, we may fail to call out to you and become lost children."
      - "Intercede for us, dear Mother, in obtaining pardon for our sins, love for Jesus, final perseverance, and the grace always to call upon you, Our Lady of Perpetual Help."
  visitor_access:
    parking_entrance: "Parking is available near the church. The main entrance has a ramp with railings, and there are no steps that prevent access to worship."
    family_seating: "Families are welcome to sit together throughout Mass. OLPH does not have a separate cry room."
    restrooms: "Accessible restrooms are available in the parish hall. A changing table is not currently available."
  history:
    - "The first Mass for the Catholic community that became Our Lady of Perpetual Help was celebrated in a parishioner’s home by Rev. Urban de Hasque on August 21, 1902. Under the direction of Rev. William Huffer of Lawton, a church was established and built in 1904."
    - "The early parish community was made up largely of farm families. A school was established in 1909, and the first rectory was built in 1910 during the residency of Rev. Anthony Van der Grinten."
    - "After fire destroyed the church on December 22, 1928, the parish quickly began rebuilding. The present church was dedicated to Our Lady of Perpetual Help on October 8, 1929. The old school building still stands and now serves as a fellowship hall, religious education space, and parish activity space."
  history_source_note: "History adapted from the former Tri-Parish About page."

