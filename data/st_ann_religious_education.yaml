faqs:
  - question: "When does St. Ann Religious Education meet?"
    answer: "St. Ann Religious Education meets on Sundays at 9:30 AM during the school year. Confirmation meets on Wednesday evenings from 6:30–8:30 PM. Check the current newsletter for class dates and special activities."

  - question: "How will I hear about class changes and upcoming events?"
    answer: "The Religious Education newsletter is the best place for current class dates, parent reminders, and upcoming events. Families can also follow St. Ann’s RE on Facebook and watch the parish bulletin for updates."

  - question: "What if my child needs to miss class?"
    answer: "Please let the Religious Education coordinator know as soon as you can. The parish can help your family stay connected with the lesson and any important preparation."

  - question: "What about First Reconciliation, First Holy Communion, or Confirmation?"
    answer: "Contact the parish office or Religious Education coordinator early. Preparation depends on a child’s age, prior formation, and sacramental history, and the parish will explain the next step for your family."

  - question: "Is there a fee for St. Ann Religious Education?"
    answer: "St. Ann strives to offer Religious Education without a class fee. Donations and occasional fundraisers help cover the approximately $50 per student cost of the program."
