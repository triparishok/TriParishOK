items:
  - image: /images/img5387.jpeg
    caption: Outdoor chapel prepared for All Souls’ Day Mass.
    alt: A covered, open-air chapel with a concrete walkway leading between rows of
      white benches with red cushions toward a white-draped altar and crucifix.
    credit: Mary Kilgore
  - image: /images/img5388.jpeg
    caption: Altar prepared for All Souls’ Day Mass and cemetery blessing.
    alt: A white-draped altar with a gold cross, two candles, and liturgical books
      beneath a large wooden crucifix. Additional tables hold sacred vessels and
      other items for Mass.
    credit: "Mary Kilgore "
  - image: /images/img5392.jpeg
    caption: Blessing the cemetery with holy water on All Souls’ Day.
    alt: A priest raises an aspergillum to sprinkle holy water over cemetery graves
      while an altar server accompanies him.
    credit: Photograph by Amber Largent; parish-owned and used with permission
  - image: /images/img5395-2.jpeg
    caption: Continuing the cemetery blessing on All Souls’ Day.
    alt: A priest and young altar server walk among flower-decorated headstones,
      blessing the graves with holy water.
    credit: Photograph by Amber Largent; parish-owned and used with permission
  - image: /images/426eb172-e82c-4a15-9c30-1d880a2b26a5.jpeg
    caption: Volunteers and students serve Thanksgiving dinner at St. Ann’s
      Religious Education Feast.
    alt: Volunteers and children serve Thanksgiving food at a buffet.
    credit: Photograph by Andrea Cummings; shared on St. Ann's RE Facebook page
  - image: /images/2037e1c4-ab86-4ed6-b8d1-c0e1c1d3607f1105c.jpeg
    caption: St. Ann’s Religious Education families gather for a Thanksgiving feast
      and fellowship.
    alt: Families and students share a meal at tables in St. Ann’s parish hall.
    credit: Photograph by Andrea Cummings; shared on St. Ann's RE Facebook page
  - image: /images/b221144d-cf38-4a7e-aa51-bf79d2e3588d1105c.jpeg
    caption: Religious Education students share their gifts through music and
      service during Mass.
    alt: Children gather with an adult near music stands in the church choir loft.
    credit: Photograph by Andrea Cummings; shared on St. Ann's RE Facebook page
  - image: /images/45b7e747-0b28-4f5d-a7fa-08d69e1d2c8d1105c.jpeg
    caption: Religious Education students take an active role in Mass, serving as
      readers, altar servers, ushers, and prayer leaders.
    alt: Three young altar servers kneel as the priest elevates the chalice during
      Mass.
    credit: Photograph by Andrea Cummings; shared on St. Ann's RE Facebook page
