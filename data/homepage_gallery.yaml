items:
  - image: /images/img5387.jpeg
    caption: Outdoor chapel prepared for All Souls’ Day Mass.
    alt: A covered, open-air chapel with a concrete walkway leading between rows of
      white benches with red cushions toward a white-draped altar and crucifix.
    credit: Mary Kilgore
  - image: /images/img5388.jpeg
    caption: Altar prepared for All Souls’ Day Mass and cemetery blessing.
    alt: A white-draped altar with a gold cross, two candles, and liturgical books
      beneath a large wooden crucifix. Additional tables hold sacred vessels and
      other items for Mass.
    credit: "Mary Kilgore "
  - image: /images/img5392.jpeg
    caption: Blessing the cemetery with holy water on All Souls’ Day.
    alt: A priest raises an aspergillum to sprinkle holy water over cemetery graves
      while an altar server accompanies him.
    credit: Photograph by Amber Largent; parish-owned and used with permission
  - image: /images/81056469226af2b894d-cc04-4f0d-9c8f-102ec14552da-medium.jpeg
    caption: Continuing the cemetery blessing on All Souls’ Day.
    alt: A priest and young altar server walk among flower-decorated headstones,
      blessing the graves with holy water.
    credit: Photograph by Amber Largent; parish-owned and used with permission
  - image: /images/81056424947e623a9cc-5e25-4e96-9d83-00bf89019aaf-medium.jpeg
    caption: Statue of the Blessed Virgin Mary decorated with flowers before the altar.
    alt: In honor of the Nativity of the Blessed Virgin Mary, St. Ann's decorated
      her statue before the altar. Happy birthday, Blessed Mother!
    credit: Fr. D
  - image: /images/81056469226af2b894d-cc04-4f0d-9c8f-102ec14552da-medium.jpeg
    caption: A special cake was prepared to celebrate the Nativity of the Blessed
      Virgin Mary.
    alt: chocolate sheet cake decorated with white and blue frosting that read's
      "Happy Birthday Our Dear Mother."
    credit: Fr. D
  - image: /images/stories/archbishop-visit-2026/archbishop-coakley-blesses-conference-media-room.jpg
    caption: Archbishop Coakley blesses the Fr. Linh Bui Conference & Media Room
    alt: Archbishop Coakley blessing the new Conference and Media Room beside its
      dedication plaque at St. Ann Catholic Church
    credit: Photograph by Ericka Hullett; parish-owned and used with permission
    link: /stories/archbishop-coakley-visit/
    link_text: View the Story & Photos
