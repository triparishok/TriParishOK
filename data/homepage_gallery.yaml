items:
  - image: /images/f1bf39f2-2697-46da-aa64-07e21adb375e.png
    caption: The Catholic Charities 2026 Campaign will take place in the pews this
      weekend. We invite you to prayerfully consider making a gift. As The Heart
      of Christ Restores, let us attempt to replicate the healing love of Christ
      to those in need and help restore the lives of the most vulnerable.
    alt: "Stained glass with the words: BE THE HEART OF CHRIST. EVERY ACT OF MERCY
      REFLECTS HIS LOVE."
    credit: Catholic Charities 2026 Campaign
    link: https://CatholicCharitiesOK.org/donate
    link_text: Donate today!
  - image: /images/81056424947e623a9cc-5e25-4e96-9d83-00bf89019aaf-medium.jpeg
    caption: Statue of the Blessed Virgin Mary decorated with flowers before the altar.
    alt: In honor of the Nativity of the Blessed Virgin Mary, St. Ann's decorated
      her statue before the altar. Happy birthday, Blessed Mother!
    credit: Fr. D
  - image: /images/81056469226af2b894d-cc04-4f0d-9c8f-102ec14552da-medium.jpeg
    caption: A special cake was prepared to celebrate the Nativity of the Blessed
      Virgin Mary.
    alt: chocolate sheet cake decorated with white and blue frosting that read's
      "Happy Birthday Our Dear Mother."
    credit: Fr. D
  - image: /images/stories/archbishop-visit-2026/archbishop-coakley-blesses-conference-media-room.jpg
    caption: Archbishop Coakley blesses the Fr. Linh Bui Conference & Media Room
    alt: Archbishop Coakley blessing the new Conference and Media Room beside its
      dedication plaque at St. Ann Catholic Church
    credit: Photograph by Ericka Hullett; parish-owned and used with permission
    link: /stories/archbishop-coakley-visit/
    link_text: View the Story & Photos
  - image: /images/a751a45e-137e-4888-b228-911aad745e351105c.jpeg
    caption: Fr. D sprinkles holy water on the congregation during the Feast of St.
      Anne blessing
    alt: Fr. D raises an aspergillum to sprinkle holy water over parishioners
      gathered outside St. Ann Church.
    credit: Ericka Hullet via St. Ann's Facebook page
  - image: /images/6f0b8a82-7b6a-4492-8387-bc008a3d5d401105c.jpeg
    caption: Fr. D blesses the outdoor shrine on the Feast of St. Anne
    alt: Fr. D swings a thurible to incense the outdoor shrine beside St. Ann Church
      as parishioners gather for the Feast of St. Anne.
    credit: Ericka Hullet via St. Ann's Facebook page
