    label: Schedule Change
    title: Advent Eucharistic Adoration
    detail: |-
      **Beginning November 30, 2026 · For Advent only**

      Prepare your heart for Christmas. Come spend time with Our Lord in the Blessed Sacrament. Special Adoration is planned Monday through Saturday during Advent.

      - **Monday, Tuesday, Wednesday & Friday — St. Ann, Elgin:** Mass at **8:30 AM**, followed by Adoration.
      - **Thursday — Our Lady of Perpetual Help, Sterling:** Starting time to be confirmed.
      - **Saturday:** Time and location to be confirmed.

      Please contact the parish office for the unconfirmed details before traveling. Check current notices for Holy Day and Christmas schedules.
