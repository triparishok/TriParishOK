    label: Current Need
    title: OLPH Thanksgiving Baskets
    detail: >-
      OLPH will be preparing and delivering Thanksgiving baskets on November 15.
      We kindly ask parishioners to bring their donated items to the Parish Hall
      that morning before Mass. Suggested donations include baked goods, nuts,
      fresh fruit, fruit cups, lotions, and other thoughtful items. Please note
      that canned vegetables are not needed.


      Thank you for your generosity and continued support in helping us bring
      joy to others this Thanksgiving!
