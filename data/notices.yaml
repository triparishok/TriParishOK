  - enabled: true
    label: Parish Event
    title: Reception Celebrating Fr. Devas’ 57th Birthday!
    detail: >-
      Please join us in the St. Ann Parish Hall, October 4th after Mass, to
      celebrate the **57th birthday of Fr. Deva!** We are grateful for his
      faithful service, spiritual guidance, and the many ways he blesses our
      parish community. 


      Everyone is invited to come together, share in fellowship, and wish Fr.
      Deva a very happy and blessed birthday.
