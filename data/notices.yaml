  - enabled: true
    label: Office Notice
    title: Book of the Names of the Dead
    detail: >-
      Christian communities remember the names of their dead, in prayers of
      intercession, and on anniversaries.


      The names of those who are called saints are chanted in litany as we
      approach Baptism and other central moments in the life of the Church.
      Especially in November, from All Saints Day until Thanksgiving, many
      parishes give a place of special honor in their church to the book
      containing the names of the dead.


      At our Parishes you may write the names of those you wish to remember in
      this special book at the back of each church.
    parishes:
      - tri-parish
