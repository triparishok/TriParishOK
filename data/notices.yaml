  - enabled: true
    label: Special Mass
    title: Anniversary Memorial Masses Remembering Father Linh - September 19th and
      20th
    detail: >-
      As we mark the first anniversary of the death of our beloved Father Linh,
      we pause with grateful hearts to remember his life and priestly ministry.
      His gentle spirit, humility, kindness, and love for God's people touched
      the lives of many.


      On this anniversary, let us give thanks for the gift of Father Linh's life
      and continue to pray for the repose of his soul, and for his Mom and Dad &
      Family. May his example of faith, humility, and love inspire us to draw
      closer to Christ.


      Eternal rest grant unto him, O Lord, and let perpetual light shine upon
      him. May he rest in peace. Amen.
