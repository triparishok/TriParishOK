  - enabled: true
    label: Current Need
    title: 2026 Catholic Charities Campaign
    detail: >-
      The 2026 Catholic Charities Campaign will take place next weekend in our
      parish.


      Your generous support will transform the lives of others to offer dignity,
      hope, and healing to those most in need.


      As in the past, an in-pew commitment process will take place next weekend,
      September 19-20. All who have not received the mailing, or have not had a
      chance to respond to it, will be asked to consider making a generous gift
      to support the ministries and services provided by Catholic Charities.


      We invite you to view stories of inspiration and more information at:
      catholiccharitiesok.org/IMPACT-STORIES
