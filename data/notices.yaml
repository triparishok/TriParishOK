    detail: >-
      The Daughters of St. Ann invite you to join us for an afternoon of fun and
      fellowship at our Bingo and Silent Auction Gift Basket Event on November
      1st from 4:00-6:30 p.m.


      Enjoy a delicious meal of soup and cornbread while playing Bingo and
      bidding on beautiful gift baskets!


      Meal and Bingo Admission:


      Adults: $20 | Children: $5 | Family Rate: $40


      Silent Auction bidding on the gift baskets will begin after 8:30am Mass.
