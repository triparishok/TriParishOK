    feature_heading: Make room for Our Lord this Advent.
    feature_image: images/st-ann-adoration-fr-undralla.jpeg
    label: Schedule Change
    title: Advent Eucharistic Adoration
    detail: |-
      **Beginning November 30, 2026 · For Advent only**

      Prepare your heart for Christmas. Come and spend time with Our Lord in the Blessed Sacrament. During Advent, Mass is at **8:30 AM Monday through Saturday**, followed by Adoration.

      - **Monday, Tuesday, Wednesday, Friday & Saturday:** St. Ann, Elgin.
      - **Thursday:** Our Lady of Perpetual Help, Sterling.

      **Advent dates to remember**

      - **Immaculate Conception of the Blessed Virgin Mary — Holy Day of Obligation:** Monday, December 7 vigil at **6:30 PM in Sterling**. Tuesday, December 8: **8:30 AM & 7:00 PM in Elgin; 4:30 PM in Sterling**.
      - **Wednesday, December 9:** Advent Penance Rite at **6:30 PM at St. Ann**.

      This Advent morning schedule takes precedence over the regular weekday schedule. Check current notices for Holy Day and Christmas schedules.
