  - enabled: true
    label: Current Need
    title: Extraordinary Ministers of Holy Communion
    detail: >-
      If anyone is interested in becoming an Extraordinary Minister of Holy
      Communion (a shortened title is Communion Minister) or those whose terms
      are being renewed after completing a three year term, please contact the
      Parish Office by October 26. These names will be submitted by Fr. Deva to
      Archbishop Coakley.


      Qualifications of Candidates:


      1. Candidates must be mature, practicing Catholics who, ordinarily, are at
      least eighteen years of age

      2. Candidates should have received the Sacrament of Confirmation.

      3. Candidates who are converts should be active members of the Church for
      at least three years.

      4. Candidates who are married must be in a valid marriage.

      5. Candidates must not be under any censure.

      6. The public life of the candidate must reflect the teachings of the
      Church.
    parishes:
      - tri-parish
    start_date: 2026-09-19
    end_date: 2026-10-26
    affects_schedule: false
