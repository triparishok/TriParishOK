  homily:
    enabled: true
    title: The Treasure Worth Everything
    intro: "In this Sunday’s Gospel (Matthew 13:44–52), Jesus shares three parables
      about the Kingdom of Heaven: a hidden treasure, a priceless pearl, and a
      fishing net. Together, they remind us that God’s Kingdom is worth more
      than anything else."
    paragraphs:
      - text: >-
          The man who finds the treasure and the merchant who discovers the
          pearl joyfully give up everything to gain what they have found. Jesus
          teaches that life with Him is worth every sacrifice because nothing
          compares to His love, mercy, and the gift of eternal life.


          The Gospel invites us to ask: **What do we treasure most?** Jesus
          calls us to place Him at the center of our lives, choosing God’s will
          above our own each day.


          The parable of the fishing net reminds us that God’s invitation is
          open to everyone. While each of us will one day answer for our
          response to His grace, God continually offers opportunities to  
          repent, grow in holiness, and share His love.


          May we ask the Lord this week for the wisdom to recognize the true
          treasure of His Kingdom and the courage to put Him above all else. In
          doing so, we will find the lasting joy that only He can give.
